[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aspired"
version = "0.6.0"
description = "The iraf-free spectral data reduction toolkit."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Marco C Lam", email = "mlam@roe.ac.uk" },
    { name = "Robert J Smith", email = "r.j.smith@ljmu.ac.uk" },
]
maintainers = [{ name = "Marco C Lam", email = "mlam@roe.ac.uk" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "astropy>=5.3",
    "astroscrappy>=1.1",
    "ccdproc>=2.3,!=2.4.0",
    "kaleido>=1.2",
    "numpy>=1.26",
    "plotly>=5.24",
    "rascal>=0.3.11,<0.4",
    "scipy>=1.9",
    "spectresc>=1.1",
    "specutils>=1.8",
    "statsmodels>=0.13",
]

[project.optional-dependencies]
test = [
    "psutil>=5.9.4",
    "pytest>=5.3",
    "pytest-cov>=2.8",
    "requests>=2.28.1",
]
dev = [
    "aspired[test]",
    "flake8>=5.0.4",
    "isort>=5.11",
]

[project.urls]
Homepage = "https://aspired.readthedocs.io/en/latest/?badge=latest"
Documentation = "https://aspired.readthedocs.io/"
Repository = "https://github.com/cylammarco/aspired"
Download = "https://github.com/cylammarco/aspired"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aspired = ["standards/**/*", "extinction/*", "telluric/*"]

[tool.coverage.run]
relative_files = true
branch = true
source = ["aspired"]
data_file = ".coverage"
omit = ["*/__init__.py"]
