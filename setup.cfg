[metadata]
name = aspired
version = 0.6.0
license = BSD-3-Clause
license_files = LICENSE
description = The iraf-free spectral data reduction toolkit.
long_description = file: README.md
long_description_content_type = text/markdown
readme = README.md
author = Marco C Lam, Robert J Smith
author_email = mlam@roe.ac.uk, r.j.smith@ljmu.ac.uk
maintainer = Marco C Lam
maintainer_email = mlam@roe.ac.uk
url = https://aspired.readthedocs.io/en/latest/?badge=latest
download_url = https://github.com/cylammarco/aspired
classifiers =
    License :: OSI Approved :: BSD License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Operating System :: OS Independent

[options]
zip_safe = False
package_dir=
    =src
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    astropy>=5.3
    numpy>=1.26
    scipy>=1.7
    plotly>=5.6
    kaleido>=1.2
    astroscrappy>=1.1
    ccdproc>=2.3,!=2.4.0
    statsmodels>=0.13
    spectresc>=1.1
    specutils>=1.8
    rascal<0.4
setup_requires =
    pytest>=5.3
    pytest-cov>=2.8
    requests>=2.27
    spectres>=2.2.0

[coverage:run]
relative_files = True

[options.packages.find]
where=src